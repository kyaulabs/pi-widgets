# git-cliff configuration for GitHub Release notes.
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% for group, commits in commits | sort(attribute="group") | group_by(attribute="group") %}
## {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/kyaulabs/pi-widgets/commit/{{ commit.id }}))
{% if commit.breaking %}  - **Breaking:** {{ commit.breaking_description }}
{% endif %}{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^patch", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs", group = "📝 Documentation" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^build", group = "📦 Build" },
  { message = "^ci", group = "👷 CI/CD" },
  { message = "^style", group = "🎨 Styling" },
  { message = "^revert", group = "⏪ Reverts" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "🔧 Maintenance" },
  { message = "^ignore", skip = true },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
